name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: memapp-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm

      - name: Install and build
        env:
          VITE_API_BASE_URL: https://api.ymemberapp.com
        run: |
          npm ci
          npm run build
          test -n "$(find dist/assets -name '*.js' | head -1)"

      - name: Upload dist artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: memapp-web-dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy production
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: memapp-web-dist
          path: dist

      - name: Pack dist
        run: tar -czf dist.tgz -C dist .

      - name: Upload build to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: dist.tgz
          target: /tmp
          timeout: 120s

      - name: Install build
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            WEB_DIR="/var/www/memapp-web"
            ARCHIVE="/tmp/dist.tgz"
            STAGE="$(mktemp -d /tmp/memapp-web-dist.XXXXXX)"
            uid="$(id -u)"
            gid="$(id -g)"

            tar -xzf "$ARCHIVE" -C "$STAGE"
            rm -f "$ARCHIVE"

            ensure_dist_writable() {
              mkdir -p "$WEB_DIR/dist" 2>/dev/null || true
              if touch "$WEB_DIR/dist/.write-test" 2>/dev/null; then
                rm -f "$WEB_DIR/dist/.write-test"
                if find "$WEB_DIR/dist" -mindepth 1 -delete 2>/dev/null; then
                  return 0
                fi
              fi

              echo "Resetting ownership of $WEB_DIR/dist to ${uid}:${gid}"
              cmd="mkdir -p /web/dist && chown -R ${uid}:${gid} /web/dist && find /web/dist -mindepth 1 -delete"

              if docker info >/dev/null 2>&1; then
                docker run --rm -v "$WEB_DIR":/web alpine sh -c "$cmd"
                return 0
              fi
              if command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
                sudo docker run --rm -v "$WEB_DIR":/web alpine sh -c "$cmd"
                return 0
              fi
              if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
                sudo mkdir -p "$WEB_DIR/dist"
                sudo chown -R "${uid}:${gid}" "$WEB_DIR/dist"
                sudo find "$WEB_DIR/dist" -mindepth 1 -delete
                return 0
              fi

              echo "Cannot write $WEB_DIR/dist. Add $(id -un) to the docker group or allow passwordless sudo." >&2
              exit 1
            }

            ensure_dist_writable
            mkdir -p "$WEB_DIR/dist"
            cp -R "$STAGE"/. "$WEB_DIR/dist"/
            rm -rf "$STAGE"

            if [[ -f "$WEB_DIR/runtime-config.json" ]]; then
              cp "$WEB_DIR/runtime-config.json" "$WEB_DIR/dist/config.json"
            fi
            if [[ ! -f "$WEB_DIR/dist/index.html" ]]; then
              echo "Deploy failed: dist/index.html missing" >&2
              exit 1
            fi

            restart_caddy() {
              if docker info >/dev/null 2>&1; then
                docker compose restart caddy
              elif command -v sudo >/dev/null && sudo -n docker info >/dev/null 2>&1; then
                sudo docker compose restart caddy
              else
                echo "Could not restart Caddy (no docker access). Static files are updated in place."
                return 0
              fi
            }

            if [[ -d /var/www/memappcaddy ]]; then
              cd /var/www/memappcaddy
              restart_caddy
            fi
            echo "memapp-web deploy complete"

      - name: Health check
        run: |
          for host in https://admin.ymemberapp.com https://ymemberapp.com; do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 "$host/")"
            echo "$host -> $code"
            if [[ "$code" != "200" ]]; then
              echo "Health check failed for $host"
              exit 1
            fi
          done
